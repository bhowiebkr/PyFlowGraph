# .github/workflows/create-release.yml
# Manual workflow to create GitHub releases from stored build artifacts.
# This allows you to test builds locally before making them public.

name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version to release (e.g., v1.0.0)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - prerelease
      make_latest:
        description: 'Mark as latest release'
        required: true
        default: true
        type: boolean

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # To create the release
      actions: read        # To download artifacts
      pull-requests: read  # To read PRs for the changelog

    # Scripts read the inputs from these variables. An expression inside a script would
    # become part of the script text.
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      MAKE_LATEST: ${{ inputs.make_latest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Validate tag exists
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" > /dev/null; then
            echo "ERROR: Tag '$TAG_NAME' does not exist!"
            exit 1
          fi
          echo "SUCCESS: Tag '$TAG_NAME' found"

      - name: Find build artifact
        id: find_artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = `PyFlowGraph-Windows-${process.env.TAG_NAME}`;
            
            // Search for recent successful builds (last 50 runs)
            const workflowRuns = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'windows-build.yml',
              status: 'completed',
              conclusion: 'success',
              per_page: 50
            });
            
            console.log(`Searching for artifact '${artifactName}' in ${workflowRuns.data.workflow_runs.length} recent successful builds...`);
            
            // Search through recent successful builds to find the artifact
            let foundArtifact = null;
            let foundRunId = null;
            
            for (const run of workflowRuns.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              
              const artifact = artifacts.data.artifacts.find(a => a.name === artifactName);
              if (artifact) {
                foundArtifact = artifact;
                foundRunId = run.id;
                console.log(`Found artifact '${artifactName}' in build run ${run.id} (commit: ${run.head_sha.substring(0,7)})`);
                break;
              }
            }
            
            if (!foundArtifact) {
              throw new Error(`Artifact '${artifactName}' not found in any recent successful builds`);
            }
            
            console.log(`Using artifact: ${foundArtifact.name} (ID: ${foundArtifact.id})`);
            
            core.setOutput('artifact_id', foundArtifact.id);
            core.setOutput('run_id', foundRunId);
            core.setOutput('artifact_name', foundArtifact.name);

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: PyFlowGraph-Windows-${{ inputs.tag_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_artifact.outputs.run_id }}
          # A folder of its own, so that the zip holds the built app and none of the checkout.
          path: release_files

      - name: Verify and prepare artifact for release
        id: verify
        run: |
          zip_file="PyFlowGraph-Windows-$TAG_NAME.zip"

          for required in release_files/PyFlowGraph.exe release_files/examples release_files/python_runtime; do
            if [ ! -e "$required" ]; then
              echo "ERROR: $required is not in the build artifact"
              ls -la release_files
              exit 1
            fi
          done
          echo "- PyFlowGraph.exe: $(ls -lh release_files/PyFlowGraph.exe | awk '{print $5}')"
          echo "- Examples: $(ls release_files/examples | wc -l) files"

          cp LICENSE.txt release_files/
          (cd release_files && zip -qr "../$zip_file" .)

          file_size=$(stat -c%s "$zip_file")
          echo "Created release package: $zip_file ($file_size bytes)"
          echo "zip_file=$zip_file" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          fromTag: ${{ inputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          body: |
            ## What's Changed
            ---
            
            ${{ steps.changelog.outputs.changelog }}
            
            ---
            
            **Build Information:**
            - Built from commit: ${{ github.sha }}
            - Artifact: ${{ steps.verify.outputs.zip_file }}
            - Build run: [#${{ steps.find_artifact.outputs.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ steps.find_artifact.outputs.run_id }})
          files: ${{ steps.verify.outputs.zip_file }}
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          make_latest: ${{ inputs.make_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** $TAG_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** $RELEASE_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "**Latest:** $MAKE_LATEST" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** ${{ steps.create_release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The release has been published and is now available for download."